workflows:
  ios-unsigned-ipa:
    name: iOS unsigned IPA for external re-signing
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.joybeedigital.nutreluma
        APP_NAME: NutreLuma
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Generate native iOS project
        script: |
          npx expo prebuild --platform ios --clean --non-interactive
      - name: Install pods
        script: |
          cd ios
          pod install
      - name: Build unsigned iPhone archive
        script: |
          set -euo pipefail

          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "No Xcode workspace found in ios/"
            exit 1
          fi

          SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" \
            | python3 -c "import json,sys; data=json.load(sys.stdin); schemes=data.get('workspace',{}).get('schemes',[]); print(next((s for s in schemes if 'NutreLuma' in s), schemes[0] if schemes else ''))")
          if [ -z "$SCHEME" ]; then
            echo "No Xcode scheme found"
            exit 1
          fi

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/build/$APP_NAME.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"
      - name: Package unsigned IPA
        script: |
          set -euo pipefail

          APP_PATH=$(find "$CM_BUILD_DIR/build/$APP_NAME.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No archived .app found"
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/unsigned-ipa"
          mkdir -p "$CM_BUILD_DIR/unsigned-ipa/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/unsigned-ipa/Payload/"
          cd "$CM_BUILD_DIR/unsigned-ipa"
          /usr/bin/zip -qry "$CM_BUILD_DIR/${APP_NAME}-unsigned.ipa" Payload
    artifacts:
      - build/*.xcarchive
      - "*.ipa"

  ios-simulator-app:
    name: iOS simulator app
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      cocoapods: default
      vars:
        APP_NAME: NutreLuma
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Generate native iOS project
        script: |
          npx expo prebuild --platform ios --clean --non-interactive
      - name: Install pods
        script: |
          cd ios
          pod install
      - name: Build unsigned simulator app
        script: |
          set -euo pipefail

          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" \
            | python3 -c "import json,sys; data=json.load(sys.stdin); schemes=data.get('workspace',{}).get('schemes',[]); print(next((s for s in schemes if 'NutreLuma' in s), schemes[0] if schemes else ''))")

          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath "$CM_BUILD_DIR/derived-data" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p "$CM_BUILD_DIR/simulator-artifacts"
          APP_PATH=$(find "$CM_BUILD_DIR/derived-data/Build/Products" -name "*.app" -type d | head -n 1)
          cp -R "$APP_PATH" "$CM_BUILD_DIR/simulator-artifacts/"
    artifacts:
      - simulator-artifacts/*.app
