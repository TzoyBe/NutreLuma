# Cloudflare Tunnel: βγάζει ΜΟΝΟ την εφαρμογή στο internet, με HTTPS.
#
# Δεν ανοίγει καμία θύρα στο router και δεν εκθέτει το NAS. Ο connector κάνει
# εξερχόμενη σύνδεση προς την Cloudflare και η κίνηση επιστρέφει μέσα από αυτήν.
#
# Χρήση:
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml \
#     --env-file .env up -d
#
# Η Cloudflare τερματίζει το TLS και ο origin βλέπει καθαρό http μέσα στο
# δίκτυο του Docker. Αυτό που καθορίζει ότι τα cookies πρέπει να είναι Secure
# είναι το APP_URL (https://…), όχι το πρωτόκολλο της σύνδεσης.

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: nutreluma-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
      # Endpoint διάγνωσης μέσα στο container (δεν εκτίθεται προς τα έξω).
      TUNNEL_METRICS: 0.0.0.0:2000
    depends_on:
      web:
        condition: service_healthy
    # Ο connector δεν χρειάζεται κανένα επιπλέον δικαίωμα στο host.
    security_opt:
      - no-new-privileges:true
    # ΑΠΑΡΑΙΤΗΤΟ: το base compose ορίζει δικό του δίκτυο. Χωρίς αυτό το
    # cloudflared προσαρτάται στο default δίκτυο και ΔΕΝ βλέπει το `web`,
    # οπότε η Cloudflare επιστρέφει 502 μόλις ρυθμιστεί το hostname.
    networks:
      - nutreluma
